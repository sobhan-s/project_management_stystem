version: "3"
 
services:
  backend:
    build: .
    container_name: pms
    expose:
      - "8000"
    command: npm run start
 
  nginx:
    image: nginx:alpine
    container_name: pms-ngnix
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
 
 